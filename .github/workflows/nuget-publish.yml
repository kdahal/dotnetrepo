name: Deploy and Publish Function App

on:
  push:
    branches:
      - dev # Or your main branch
  workflow_dispatch:
    inputs:
      azure_resource_group:
        description: 'Azure Resource Group name'
        required: true
        type: string
      azure_functionapp_name:
        description: 'Name of the Azure Function App'
        required: true
        type: string
      function_path:
        description: 'Path to the Function App project within the repository (e.g., Let, mattress)'
        required: true
        type: string
      package_name:
        description: 'Name of the .csproj file (e.g., Let.csproj)'
        required: true
        type: string
      nuget_version:
        description: 'Version for the NuGet package'
        required: true
        type: string
      dotnet_version:
        description: 'Target .NET SDK version'
        required: false
        type: string
        default: '6.0' # Or your preferred default version

# No longer defining environment variables here
# env:
#   AZURE_RESOURCES_GROUP: ${{ secrets.AZURE_RESOURCES_GROUP }}
#   AZURE_FUNCTIONAPP_NAME: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
#   FUNCTION_NAME_PATH: ${{ env.FUNCTION_NAME_PATH }}
#   PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
#   DOTNET_VERSION: ${{ env.DOTNET_VERSION }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ github.event.inputs.dotnet_version }}

      - name: Restore dependencies
        run: dotnet restore ${{ github.event.inputs.function_path }}/${{ github.event.inputs.package_name }}

      - name: Build project
        run: dotnet build ${{ github.event.inputs.function_path }}/${{ github.event.inputs.package_name }} -c Release

      - name: Pack NuGet package
        run: |
          dotnet pack ${{ github.event.inputs.function_path }}/${{ github.event.inputs.package_name }} -c Release -o ./nupkg /p:PackageVersion=${{ github.event.inputs.nuget_version }}

      - name: Publish NuGet package to GitHub Packages
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}"

      - name: Publish
        run: dotnet publish ${{ github.event.inputs.function_path }}/${{ github.event.inputs.package_name }} -c Release -o ./publish

      - name: Deploy to Azure Function App (Direct Zip Deployment)
        uses: azure/functions-action@v1
        with:
          app-name: ${{ github.event.inputs.azure_functionapp_name }}
          package: './publish'
          publish-type: zip
          slot-name: production
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          RESOURCE_GROUP: ${{ github.event.inputs.azure_resource_group }}

      - name: Wait for Function App to Start
        if: success()
        run: sleep 10

      - name: Verify Deployment (HTTP)
        if: success()
        run: |
          FUNCTION_APP_URL="https://${{ github.event.inputs.azure_functionapp_name }}.azurewebsites.net/api/YourFunctionEndpoint"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$FUNCTION_APP_URL")
          echo "Function App URL: $FUNCTION_APP_URL"
          echo "HTTP Status Code: $STATUS_CODE"
          if [ $STATUS_CODE -eq 200 ]; then
            echo "Successfully verified Function App deployment!"
          else
            echo "Failed to verify Function App deployment. Status code: $STATUS_CODE"
            exit 1
          fi
