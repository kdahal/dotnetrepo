
name: Nuget Publish

name: Deploy and Publish Function App


on:
  push:
    branches:
      - nuget-publish # Or your main branch
      - dev # Or your main branch
  workflow_dispatch:
    inputs:
      azure_resource_group:
        description: 'Azure Resource Group name'
        required: true
        type: string
      azure_functionapp_name:
        description: 'Name of the Azure Function App'
        required: true
        type: string
      function_path:
        description: 'Path to the Function App project within the repository (e.g., Let, mattress)'
        required: true
        type: string
      package_name:
        description: 'Name of the .csproj file (e.g., Let.csproj)'
        required: true
        type: string
      nuget_version:
        description: 'Version for the NuGet package'
        required: true
        type: string
      dotnet_version:
        description: 'Target .NET SDK version'
        required: false
        type: string
        default: '6.0' # Or your preferred default version


# env: # Define environment variables for clarity and reusability
#   FUNCTION_APP_PROJECT_PATH: 'WebApplication1/src' # Path to your Function App project directory
#   FUNCTION_APP_PROJECT_NAME: 'WebApplication1' # Name of your Function App (e.g., MyFunctionApp, derived from .csproj name)
#   DOTNET_VERSION: '9.x' # Your desired .NET version, e.g., '6.x', '8.x'
#   nuget_version: 1.0.0


permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ github.event.inputs.dotnet_version }}

      - name: Restore dependencies

        run: dotnet restore ${{ github.event.inputs.function_path }}/${{ github.event.inputs.package_name }}.csproj

      - name: Build project
        run: dotnet build ${{ github.event.inputs.function_path }}/${{ github.event.inputs.package_name }}.csproj -c Release --no-restore

      - name: Pack NuGet package
        run: dotnet pack ${{ github.event.inputs.function_path }}/${{ github.event.inputs.package_name }}.csproj -c Release -o ./nupkg /p:PackageVersion=${{ github.event.inputs.nuget_version }}

    #   - name: List files for debugging
    #     run: ls -R   

      - name: Publish NuGet package to GitHub Packages
        run: dotnet nuget push "./nupkg/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

    #   - name: Publish
    #     run: dotnet publish ${{ github.event.inputsFUNCTION_APP_PROJECT_PATH }}/${{ github.event.inputsFUNCTION_APP_PROJECT_NAME }} -c Release -o ./publish

    #   - name: Deploy to Azure Function App (Direct Zip Deployment)
